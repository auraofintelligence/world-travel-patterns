name: Weekly source watch
# Monday 05:00 Brisbane. Every cited source: still there, and has its text changed?
on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Watch sources
        run: python scripts/source_watch.py > "$RUNNER_TEMP/report.md"
      - name: Rebuild the public queue
        run: python scripts/due.py
      - name: Rebuild the website index
        run: python scripts/build_site.py
      - name: Validate
        run: python scripts/validate.py
      - name: Commit
        run: bash scripts/ci_commit.sh "Weekly source watch" data/source-status.json
      - name: Open an issue when sources moved or died
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -qE "^- (not found|changed):" "$RUNNER_TEMP/report.md"; then
            gh issue create --title "Source watch $(date -u +%F)" --body-file "$RUNNER_TEMP/report.md"
          fi
