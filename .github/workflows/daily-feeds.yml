name: Daily feeds
# 08:45 Brisbane, after GAJRA Earth's Ahead routine (07:40) has published.
on:
  schedule:
    - cron: "45 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: GAJRA Earth Ahead (AI governance events and open doors)
        run: python scripts/feed_gajra_ahead.py
      - run: python scripts/due.py
      - run: python scripts/build_site.py
      - run: python scripts/validate.py
      - name: Commit
        run: bash scripts/ci_commit.sh "Daily feeds" data/feeds
