name: Daily advisories and queue
# 06:00 Brisbane. Smartraveller levels for every destination, then the public queue.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the Smartraveller export
        id: fetch
        # HTTP/2 streams from Smartraveller were closing uncleanly (curl exit 92) from 31 October 2026.
        # Force HTTP/1.1, retry, and fail soft so the queue and site still rebuild if the export is unreachable.
        run: |
          if curl -sSf --http1.1 --retry 3 --retry-all-errors --retry-delay 10 -m 120 \
               -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36 world-travel-patterns/1.0" \
               -H "Accept: application/json" \
               https://www.smartraveller.gov.au/destinations-export -o "$RUNNER_TEMP/export.json" \
             && python -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/export.json"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Smartraveller export could not be fetched or parsed; advice levels not updated this run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update advice levels
        if: steps.fetch.outputs.ok == 'true'
        run: python scripts/advisories.py "$RUNNER_TEMP/export.json" > "$RUNNER_TEMP/changes.md"
      - name: Rebuild the public queue
        run: python scripts/due.py
      - name: Rebuild the website index
        run: python scripts/build_site.py
      - name: Validate
        run: python scripts/validate.py
      - name: Commit
        run: bash scripts/ci_commit.sh "Daily advisories and queue" data/advisories.json data/logs
      - name: Open an issue for level changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s "$RUNNER_TEMP/changes.md" ]; then
            gh issue create --title "Advice level changes $(date -u +%F)" --label advisory --body-file "$RUNNER_TEMP/changes.md" || \
            gh issue create --title "Advice level changes $(date -u +%F)" --body-file "$RUNNER_TEMP/changes.md"
          fi
