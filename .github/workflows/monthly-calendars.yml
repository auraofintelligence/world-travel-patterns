name: Monthly calendars
# 1st of the month, 05:00 Brisbane. Public holidays for this year and next (signal layer of culture cycles).
on:
  schedule:
    - cron: "0 19 1 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  calendars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/holidays.py
      - run: python scripts/due.py
      - name: Rebuild the website index
        run: python scripts/build_site.py
      - run: python scripts/validate.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar queue site/data
          git diff --cached --quiet || (git commit -m "Monthly calendars" && git pull --rebase && git push)
